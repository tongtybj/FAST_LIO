oneshot: false

reverse_tf: false

localization_freq: 100

initial_guess:
        pos: [0, 0, 0]
        rpy: [0, 0, 0]

registration:
        scan_stack_size: 10
        init:
                map_voxel_size: 0.2 # 0.2: best
                scan_voxel_size: 0.2 # 0.2: best
                max_corres_dist: 0.4 # 0.4: best
                localization_thresh: 0.6
                map_range: 30.0
                scan_range: 30.0 
        float:
                map_voxel_size: 0.1
                scan_voxel_size: 0.1
                max_corres_dist: 0.2
                localization_thresh: 0.7
                map_range: 30.0 
                scan_range: 30.0
        fix:
                map_voxel_size: 0.05 # 0.02
                scan_voxel_size: 0.05 # 0.02
                max_corres_dist: 0.1 # 0.02
                localization_thresh: 0.9
                map_range: 30.0
                scan_range: 30.0
